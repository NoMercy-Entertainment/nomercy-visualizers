name: Bundle

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the headless Chromium the preview tests render with
        run: npx playwright-core install --with-deps chromium-headless-shell
      - name: Tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build the bundle
        run: npm run build:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: visualizers-bundle
          path: |
            dist/visualizers-bundle.json.gz
            dist/textures/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: visualizers-bundle
          path: dist
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Visualizer bundle $TAG."
          gh release upload "$TAG" --clobber dist/visualizers-bundle.json.gz dist/textures/*
